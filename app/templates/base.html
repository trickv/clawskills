<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ClawSkills{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script data-goatcounter="https://stats.home.v9n.us/count"
            async src="https://stats.home.v9n.us/count.js"></script>
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo">🤖 ClawSkills</a>
            <div class="nav-links">

                <a href="/submit">Submit</a>
                <a href="/stats">Stats</a>
                <a href="/about">About</a>
            </div>
        </nav>
    </header>
    
    <main>
        {% block content %}{% endblock %}

    <footer>
        <p>ClawSkills - AI Agent Skill Registry</p>
        <p><a href="/health">API Health</a> | <a href="/api/stats">API Stats</a></p>
