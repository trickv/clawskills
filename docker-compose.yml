services:
  clawskills:
    build: .
    container_name: clawskills
    volumes:
      - clawskills_data:/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/clawskills.db
      - API_KEYS_SEED=${API_KEYS_SEED:-}
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=trick@vanstaveren.us
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=clawskills@vanstaveren.us
      - BASE_URL=https://clawskills.tech
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.clawskills.rule=Host(`clawskills.home.v9n.us`) || Host(`clawskills.tech`)"
      - "traefik.http.routers.clawskills.entrypoints=websecure"
      - "traefik.http.routers.clawskills.tls.certresolver=le"
      - "traefik.http.services.clawskills.loadbalancer.server.port=8000"

volumes:
  clawskills_data:

networks:
  traefik:
    external: true
    name: docker-services_default
